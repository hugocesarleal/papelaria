<!DOCTYPE html>
<html lang="pt-br">
<head>
        <meta charset="UTF-8">
        <title>Erro</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css">
        <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
        <style>
                /* Import Google font */
                @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap');
                * {
                        margin: 0;
                        padding: 0;
                        box-sizing: border-box;
                        font-family: 'Open Sans', sans-serif;
                }
                body {
                        display: flex;
                        flex-direction: column;
                        align-items: center;
                        justify-content: center;
                        min-height: 100vh;
                        background: #E3F2FD;
                }
                .error-container {
                        text-align: center;
                        margin-top: 1px;
                }
                .error-container h1 {
                        font-size: 5rem; /* Ajuste o tamanho conforme necessário */
                }

                .error-container p {
                        font-size: 1rem; /* Ajuste o tamanho conforme necessário */
                }
                .wrapper {
                        width: 65vmin;
                        height: 70vmin;
                        display: flex;
                        overflow: hidden;
                        flex-direction: column;
                        justify-content: center;
                        border-radius: 5px;
                        background: #293447;
                        box-shadow: 0 20px 40px rgba(52, 87, 220, 0.2);
                        margin-top: 5px;
                }
                .game-details {
                        color: #B8C6DC;
                        font-weight: 500;
                        font-size: 1.2rem;
                        padding: 20px 27px;
                        display: flex;
                        justify-content: space-between;
                }
                .play-board {
                        height: 100%;
                        width: 100%;
                        display: grid;
                        background: #212837;
                        grid-template: repeat(30, 1fr) / repeat(30, 1fr);
                }
                .play-board .food {
                        background: #FF003D;
                }
                .play-board .head {
                        background: #60CBFF;
                }
                .controls {
                        display: none;
                        justify-content: center;
                        align-items: center;
                        width: 100px;
                        height: 150px;
                        margin: 5px auto;
                        grid-template-columns: repeat(3, 1fr);
                        grid-template-rows: repeat(3, 1fr);
                }
                .controls i {
                        width: 50px; /* Defina a largura fixa */
                        height: 50px; /* Defina a altura fixa */
                        padding: 15px;
                        text-align: center;
                        font-size: 1.3rem;
                        color: #B8C6DC;
                        cursor: pointer;
                        border: 1px solid #171B26;
                        box-sizing: border-box;
                        border-radius: 50%; /* Adicione esta linha para deixar os botões redondos */
                }
                .controls .up {
                        grid-area: 1 / 2;
                }
                .controls .left {
                        grid-area: 2 / 1;
                }
                .controls .right {
                        grid-area: 2 / 3;
                }
                .controls .down {
                        grid-area: 3 / 2;
                }
                .start-message {
                        position: absolute;
                        top: 50%;
                        left: 50%;
                        transform: translate(-50%, -50%);
                        background: rgba(0, 0, 0, 0.5);
                        color: white;
                        padding: 10px 20px;
                        border-radius: 5px;
                        font-size: 1.5rem;
                        text-align: center;
                        z-index: 10;
                }
                @media screen and (max-width: 800px) {
                        .wrapper {
                                width: 90vmin;
                                height: 150vmin;
                        }
                        .game-details {
                                font-size: 1rem;
                                padding: 20px 27px;
                        }
                        .controls {
                                display: grid;
                        }
                        .controls i {
                                padding: 5px;
                                font-size: 2rem;
                        }
                        .error-container h1 {
                            font-size: 2rem; /* Ajuste o tamanho conforme necessário */
                        }
                }
        </style>
</head>
<body>
        <div class="error-container">
                <h1 class="display-1 text-danger">Erro</h1>
                <p class="lead">Algo deu errado, tente novamente mais tarde</p>
                <p class="lead">Enquanto isso, pode jogar um pouco:</p>
                <a href="{% url 'core:home' %}" class="btn btn-primary">Ir para a Página Inicial</a>
        </div>

        <div class="wrapper">
                <div class="game-details">
                        <span class="score">Pontuação: 0</span>
                        <span class="high-score">Melhor Pontuação: 0</span>
                </div>
                <div class="play-board"></div>
                <div class="start-message">Pressione qualquer direcional para começar</div>
                <div class="controls">
                        <i data-key="ArrowUp" class="fa-solid fa-arrow-up-long up"></i>
                        <i data-key="ArrowLeft" class="fa-solid fa-arrow-left-long left"></i>
                        <i data-key="ArrowRight" class="fa-solid fa-arrow-right-long right"></i>
                        <i data-key="ArrowDown" class="fa-solid fa-arrow-down-long down"></i>
                </div>
        </div>

        <script>
                const playBoard = document.querySelector(".play-board");
                const scoreElement = document.querySelector(".score");
                const highScoreElement = document.querySelector(".high-score");
                const controls = document.querySelectorAll(".controls i");

                let gameOver = false;
                let foodX, foodY;
                let snakeX = 5, snakeY = 5;
                let velocityX = 0, velocityY = 0;
                let snakeBody = [[5, 5], [5, 4], [5, 3]]; // Inicializa a cobra com tamanho 3
                let setIntervalId;
                let score = 0;

                let highScore = localStorage.getItem("high-score") || 0;
                highScoreElement.innerText = `Melhor Pontuação: ${highScore}`;

                const updateFoodPosition = () => {
                        foodX = Math.floor(Math.random() * 30) + 1;
                        foodY = Math.floor(Math.random() * 30) + 1;
                }

                const handleGameOver = () => {
                        clearInterval(setIntervalId);
                        alert("Fim de Jogo! Aperte OK para começar novamente...");
                        location.reload();
                }

                const startMessage = document.querySelector(".start-message");

                const changeDirection = e => {
                        if (startMessage) {
                                startMessage.style.display = "none";
                        }
                        if(e.key === "ArrowUp" && velocityY != 1) {
                                velocityX = 0;
                                velocityY = -1;
                        } else if(e.key === "ArrowDown" && velocityY != -1) {
                                velocityX = 0;
                                velocityY = 1;
                        } else if(e.key === "ArrowLeft" && velocityX != 1) {
                                velocityX = -1;
                                velocityY = 0;
                        } else if(e.key === "ArrowRight" && velocityX != -1) {
                                velocityX = 1;
                                velocityY = 0;
                        }
                }

                controls.forEach(button => button.addEventListener("click", () => changeDirection({ key: button.dataset.key })));

                const initGame = () => {
                        if(gameOver) return handleGameOver();
                        let html = `<div class="food" style="grid-area: ${foodY} / ${foodX}"></div>`;

                        if(snakeX === foodX && snakeY === foodY) {
                                updateFoodPosition();
                                snakeBody.push([foodY, foodX]);
                                score++;
                                highScore = score >= highScore ? score : highScore;
                                localStorage.setItem("high-score", highScore);
                                scoreElement.innerText = `Pontuação: ${score}`;
                                highScoreElement.innerText = `Melhor Pontuação: ${highScore}`;
                        }
                        snakeX += velocityX;
                        snakeY += velocityY;

                        for (let i = snakeBody.length - 1; i > 0; i--) {
                                snakeBody[i] = snakeBody[i - 1];
                        }
                        snakeBody[0] = [snakeX, snakeY];

                        if(snakeX <= 0 || snakeX > 30 || snakeY <= 0 || snakeY > 30) {
                                return gameOver = true;
                        }

                        for (let i = 0; i < snakeBody.length; i++) {
                                html += `<div class="head" style="grid-area: ${snakeBody[i][1]} / ${snakeBody[i][0]}"></div>`;
                        }
                        playBoard.innerHTML = html;
                }

                updateFoodPosition();
                setIntervalId = setInterval(initGame, 100);
                document.addEventListener("keyup", changeDirection);
        </script>
</body>
</html>
