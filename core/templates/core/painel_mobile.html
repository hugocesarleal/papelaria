{% extends 'base.html' %}

{% block title %}Upload de Foto{% endblock %}

{% block body %}

    <h1>Envie uma Foto</h1>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="file" accept="image/*" capture="camera" name="imagem">
        <button type="submit">Enviar Foto</button>
    </form>

{% endblock %}
