{% extends 'base.html' %}

{% block title %}Lista de Usuários{% endblock %}

{% block body %}
    <h2>Lista de Usuários</h2>
    <ul>
        {% for user in users %}
            <li>{{ user.username }} - {{ user.email }}</li>
        {% endfor %}
    </ul>
    <a href="{% url 'create-user' %}">Cadastrar Novo Usuário</a>
    <a href="{% url 'admin-dashboard' %}">Voltar ao painel</a>
{% endblock %}
