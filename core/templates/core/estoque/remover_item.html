<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remover Item</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }
        button {
            padding: 10px 20px;
            margin: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-confirm {
            background-color: #f44336;
            color: white;
        }
        .btn-confirm:hover {
            background-color: #d32f2f;
        }
        .btn-cancel {
            background-color: #4CAF50;
            color: white;
        }
        .btn-cancel:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1>Remover Item</h1>
    <p>Tem certeza de que deseja remover o item <strong>"{{ item.nome }}"</strong>?</p>
    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn-confirm">Sim, remover</button>
    </form>
    <a href="{% url 'listar-estoque-admin' %}" class="btn-cancel">Cancelar</a>
</body>
</html>
