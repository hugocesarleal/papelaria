<form method="POST" enctype="multipart/form-data" action="{% url 'editar-item' item.pk %}">
    {% csrf_token %}

    <div>
        <label for="nome">Nome:</label>
        {{ form.nome }}
    </div>
    
    <div>
        <label for="descricao">Descrição:</label>
        {{ form.descricao }}
    </div>

    <div>
        <label for="foto">Foto Atual:</label>
        {% if item.foto %}
            <div>
                <img src="{{ item.foto.url }}" alt="{{ item.nome }}" style="width: 300px; height: 300px;">
            </div>
        {% endif %}
        <label for="foto">Alterar Foto (opcional):</label>
        {{ form.foto }}
    </div>
    
    <div>
        <label for="valor">Valor:</label>
        {{ form.valor }}
    </div>
    
    <div>
        <label for="quantidade">Quantidade:</label>
        {{ form.quantidade }}
    </div>

    <button type="submit">Salvar Alterações</button>
</form>
