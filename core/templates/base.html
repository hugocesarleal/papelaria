{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/toastr.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link rel="stylesheet" href="{% static 'css/crud.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/@coreui/coreui@5.2.0/dist/css/coreui.min.css" rel="stylesheet" integrity="sha384-u3h5SFn5baVOWbh8UkOrAaLXttgSF0vXI15ODtCSxl0v/VKivnCN6iHCcvlyTL7L" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@coreui/icons/css/all.min.css">
    <link rel="icon" href="{% static 'img/favicon.png' %}" type="image/x-icon">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.5.0/css/font-awesome.min.css">

    <script src="{% static 'js/jquery-3.5.1.min.js' %}"></script>
    <script src="{% static 'js/popper.min.js' %}"></script>
    <script src="{% static 'js/bootstrap.min.js' %}"></script>
    <script src="{% static 'js/toastr.min.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@coreui/coreui@5.2.0/dist/js/coreui.bundle.min.js" integrity="sha384-JdRP5GRWP6APhoVS1OM/pOKMWe7q9q8hpl+J2nhCfVJKoS+yzGtELC5REIYKrymn" crossorigin="anonymous"></script>

    <style>
      @import "https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700";
      body {
          font-family: 'Poppins', sans-serif;
          background: #fafafa;
      }
      
      p {
          font-family: 'Poppins', sans-serif;
          font-size: 1.1em;
          font-weight: 300;
          line-height: 1.7em;
          color: #999;
      }
      
      a,
      a:hover,
      a:focus {
          color: inherit;
          text-decoration: none;
          transition: all 0.3s;
      }
      
      .line {
          width: 100%;
          height: 1px;
          border-bottom: 1px dashed #ddd;
          margin: 40px 0;
      }
      
      i,
      span {
          display: inline-block;
      }
      
      .wrapper {
          display: flex;
          align-items: stretch;
      }
      
      #sidebar {
          min-width: 250px;
          max-width: 250px;
          background: #7386D5;
          color: #fff;
          transition: all 0.3s;
      }
      
      #sidebar.active {
          min-width: 80px;
          max-width: 80px;
          text-align: center;
      }
      
      #sidebar.active .sidebar-header h3,
      #sidebar.active .CTAs {
          display: none;
      }
      
      #sidebar.active .sidebar-header strong {
          display: block;
      }
      
      #sidebar ul li a {
          text-align: left;
      }
      
      #sidebar.active ul li a {
          padding: 20px 10px;
          text-align: center;
          font-size: 0.85em;
      }
      
      #sidebar.active ul li a i {
          margin-right: 0;
          display: block;
          font-size: 1.8em;
          margin-bottom: 5px;
      }
      
      #sidebar.active ul ul a {
          padding: 10px !important;
      }
      
      #sidebar.active .dropdown-toggle::after {
          top: auto;
          bottom: 10px;
          right: 50%;
          -webkit-transform: translateX(50%);
          -ms-transform: translateX(50%);
          transform: translateX(50%);
      }
      
      #sidebar .sidebar-header {
          padding: 20px;
          background: #6d7fcc;
      }
      
      #sidebar .sidebar-header strong {
          display: none;
          font-size: 1.8em;
      }
      
      #sidebar ul.components {
          padding: 20px 0;
          border-bottom: 1px solid #47748b;
      }
      
      #sidebar ul li a {
          padding: 10px;
          font-size: 1.1em;
          display: block;
      }
      
      #sidebar ul li a:hover {
          color: #7386D5;
          background: #fff;
      }
      
      #sidebar ul li a i {
          margin-right: 10px;
      }
      
      #sidebar ul li.active>a,
      a[aria-expanded="true"] {
          color: #fff;
          background: #6d7fcc;
      }
      
      a[data-toggle="collapse"] {
          position: relative;
      }
      
      ul ul a {
          font-size: 0.9em !important;
          padding-left: 30px !important;
          background: #6d7fcc;
      }
      
      ul.CTAs {
          padding: 20px;
      }
      
      ul.CTAs a {
          text-align: center;
          font-size: 0.9em !important;
          display: block;
          border-radius: 5px;
          margin-bottom: 5px;
      }
      
      a.download {
          background: #fff;
          color: #7386D5;
      }
      
      a.article,
      a.article:hover {
          background: #6d7fcc !important;
          color: #fff !important;
      }
      
      #content {
          width: 100%;
          padding: 20px;
          min-height: 100vh;
          transition: all 0.3s;
      }
      
      
      @media (max-width: 768px) {
        #sidebar {
          min-width: 250px;
          max-width: 250px;
          background: #7386D5;
          color: #fff;
          transition: all 0.3s;
        }
        
        #sidebar.active {
          min-width: 80px;
          max-width: 80px;
          text-align: center;
          margin-left: 0
        }
         
          #sidebar .sidebar-header h3,
          #sidebar .CTAs {
              display: none;
          }
          #sidebar .sidebar-header strong {
              display: block;
          }
          #sidebar ul li a {
              padding: 20px 10px;
          }
          #sidebar ul li a span {
              font-size: 0.85em;
          }
          #sidebar ul li a i {
              margin-right: 0;
              display: block;
          }
          #sidebar ul ul a {
              padding: 10px !important;
          }
          #sidebar ul li a i {
              font-size: 1.3em;
          }
          #sidebar {
              margin-left: 0;
          }
          #sidebarCollapse span {
              display: none;
          }
      }
      @media (min-width: 768px) {
        .sidebar-mobile {
          display: none;
        }
      }
      
      /* Exibe o conteúdo alternativo para dispositivos maiores */
      @media (max-width: 767px) {
        .sidebar-desktop {
          display: none;
        }
      }
        
        {% block style %}
        {% endblock %}
    </style>
</head>
<body>

<div class="sidebar-desktop">
  <div class="wrapper">
    <!-- Sidebar  -->
    <nav id="sidebar" class="active">
      <div class="sidebar-header">
        <h3>Sidebar</h3>
        <strong>BS</strong>
      </div>
    
      <ul class="list-unstyled components">
        <li class="active">
          <a href="#">
            <i class="fas fa-taxi"></i>
            Richiedi
          </a>
        </li>
        <li>
          <a href="#">
            <i class="fas fa-calendar-alt"></i>
            Prenota
          </a>
        </li>
        <li>
          <a href="#">
            <i class="fas fa-history"></i>
            Storico
          </a>
        </li>
        <li>
          <a href="#">
            <i class="fas fa-book"></i>
            Istruzioni
          </a>
        </li>
        <li>
          <a href="#">
            <i class="fas fa-sign-out-alt"></i>
            Logout
          </a>
        </li>
      </ul>
    
      <ul class="list-unstyled CTAs">
        <li>
          <a href="https://bootstrapious.com/tutorial/files/sidebar.zip" class="download">
            Download source
          </a>
        </li>
        <li>
          <a href="https://bootstrapious.com/p/bootstrap-sidebar" class="article">
            Back to article
          </a>
        </li>
      </ul>
    </nav>
  
    <!-- Page Content  -->
      <div id="content">
        <div class="row">
          {% block body %}
          {% endblock %}
        </div>
      </div>
  </div>
</div>

<div class="sidebar-mobile">

</div>

</body>
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        const sidebar = document.getElementById("sidebar");
    
        // Expande a sidebar ao passar o mouse
        sidebar.addEventListener("mouseover", function() {
          sidebar.classList.remove("active");
        });
    
        // Recolhe a sidebar ao remover o mouse
        sidebar.addEventListener("mouseout", function() {
          sidebar.classList.add("active");
        });
      });
      $(document).ready(function() {
        $("#sidebarCollapse").on("click", function() {
          $("#sidebar").toggleClass("active");
        });
      });
      
        document.querySelectorAll('.nav-group-toggle').forEach((toggle) => {
            toggle.addEventListener('click', (e) => {
                e.preventDefault();
                const parent = toggle.parentElement;
                parent.classList.toggle('show');
                const groupItems = parent.querySelector('.nav-group-items');
                if (groupItems) {
                    groupItems.classList.toggle('show');
                }
            });
        });
        
        function handleUserClick() {
            const dropdown = document.getElementById("dropdown-menu");
            dropdown.classList.toggle("show");
        }
        {% block script %}
        {% endblock %}
        
        $(document).ready(function () {
            toastr.options = {
                "closeButton": true,
                "debug": false,
                "newestOnTop": true,
                "progressBar": true,
                "positionClass": "toast-top-right",
                "preventDuplicates": false,
                "onclick": null,
                "showDuration": "300",
                "hideDuration": "1000",
                "timeOut": "5000",
                "extendedTimeOut": "1000",
                "showEasing": "swing",
                "hideEasing": "linear",
                "showMethod": "fadeIn",
                "hideMethod": "fadeOut"
            };

            {% if messages %}
                {% for message in messages %}
                    {% if message.level == DEFAULT_MESSAGE_LEVELS.ERROR %}
                        toastr.error("{{ message }}", "Erro");
                    {% elif message.level == DEFAULT_MESSAGE_LEVELS.SUCCESS %}
                        toastr.success("{{ message }}", "Sucesso");
                    {% elif message.level == DEFAULT_MESSAGE_LEVELS.WARNING %}
                        toastr.warning("{{ message }}", "Aviso");
                    {% elif message.level == DEFAULT_MESSAGE_LEVELS.INFO %}
                        toastr.info("{{ message }}", "Atenção");
                    {% endif %}
                {% endfor %}
            {% endif %}

            $(document).ready(function() {
                $('#btnEsqueciSenha').click(function(event) {
                    event.preventDefault();
                    toastr.info('Se você esqueceu sua senha contate o administrador do sistema.');
                });
            });
        });
    </script>

</html>
