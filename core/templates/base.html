{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/toastr.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link rel="stylesheet" href="{% static 'css/crud.css' %}">
    <link rel="icon" href="{% static 'img/favicon.png' %}" type="image/x-icon">

    <script src="{% static 'js/jquery-3.5.1.min.js' %}"></script>
    <script src="{% static 'js/popper.min.js' %}"></script>
    <script src="{% static 'js/bootstrap.min.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #007BFF;
            padding: 10px 20px;
            color: white;
        }

        .navbar .user-icon {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .dropdown-menu {
            width: "20px";
            right: 0; /* Posiciona o dropdown na borda direita */
            left: auto; /* Remove o alinhamento à esquerda */
        }

        .custom-dropdown-menu {
            min-width: 250px;
            padding: 15px;
        }

        .customNavBar{
            margin-right: 40px;
        }

        @media (max-width: 576px) {
            .custom-dropdown-menu {
                min-width: 200px;
                padding: 10px;
                font-size: 14px;
            }
        }

        .dropdown-menu {
            right: 0; /* Alinhado à direita por padrão */
            left: auto;
        }
    
        /* Ajuste para telas pequenas */
        @media (max-width: 576px) {
            .dropdown-menu {
                left: 0; /* Alinhado à esquerda no celular */
                right: auto;
            }
        }

        {% block style %}
        {% endblock %}
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Meu Sistema</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav me-auto customNavBar">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Sobre</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Contato</a>
                    </li>
                </ul>
                <div class="dropdown">
                    <button 
                        class="btn btn-light dropdown-toggle" 
                        type="button" 
                        data-bs-toggle="dropdown" 
                        aria-expanded="false">
                        {% if user.is_authenticated %}{{ user.username }}{% else %}Visitante{% endif %}
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end custom-dropdown-menu">
                        {% if user.is_authenticated %}
                            <li>
                                <a class="dropdown-item" href="{% url 'logout' %}">Logout</a>
                            </li>
                        {% else %}
                            <form method="POST" class="px-4 py-3" action="{% url 'login' %}">
                                {% csrf_token %}
                                <div class="mb-3">
                                    <label for="username" class="form-label">Usuário:</label>
                                    <input type="text" class="form-control" name="username" required>
                                </div>
                                <div class="mb-3">
                                    <label for="password" class="form-label">Senha:</label>
                                    <input type="password" class="form-control" name="password" required>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">Entrar</button>
                            </form>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <a class="dropdown-item" href="#">Esqueceu a senha?</a>
                            </li>
                        {% endif %}
                    </ul>
                </div>
            </div>
        </div>
    </nav>
    <div class="content">
        {% block body %}
        {% endblock %}
    </div>

    <script>
        function handleUserClick() {
            const dropdown = document.getElementById("dropdown-menu");
            dropdown.classList.toggle("show");
        }
        {% block script %}
        {% endblock %}
    </script>
</body>
</html>
