{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/toastr.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link rel="stylesheet" href="{% static 'css/crud.css' %}">
    <link rel="icon" href="{% static 'img/favicon.png' %}" type="image/x-icon">

    <script src="{% static 'js/jquery-3.5.1.min.js' %}"></script>
    <script src="{% static 'js/popper.min.js' %}"></script>
    <script src="{% static 'js/bootstrap.min.js' %}"></script>
    <script src="{% static 'js/toastr.min.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #007BFF;
            padding: 10px 20px;
            color: white;
        }

        .navbar .user-icon {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 1.8rem;
            margin-right: 8px;
        }

        .navbar-nav .nav-link {
            font-size: 1.2rem;
            padding: 8px 20px;
            text-transform: uppercase;
            color: white;
            transition: background-color 0.3s ease, transform 0.3s ease;
            margin-right: 10px;
            margin-left: 10px;
        }

        .navbar-nav .nav-item {
            position: relative;
        }

        .navbar-nav .nav-link:hover {
            background-color: #0056b3;
            transform: scale(1.1);
        }

        .navbar-nav .nav-item + .nav-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 1px;
            height: 50%;
            background-color: #fff;
            transform: translateY(-50%);
        }

        .navbar-nav .nav-item .fa {
            font-size: 1.5rem;
            margin-right: 8px;
        }

        .dropdown-menu {
            width: 20px;
            right: 0;
            left: auto;
        }

        .custom-dropdown-menu {
            min-width: 250px;
            padding: 15px;
        }

        .customNavBar {
            flex: 1;
            display: flex;
            justify-content: center;
        }

        /* Ajustes para dispositivos móveis */
        @media (max-width: 576px) {
            .dropdown-menu {
                left: 0; /* Alinhado à esquerda no celular */
                right: auto;
            }
            .navbar-nav {
                justify-content: center; /* Centraliza os links no celular */
                width: 100%;
                flex-wrap: wrap; /* Garante que os itens se ajustem no celular */
            }
            .navbar-nav .nav-item {
                margin-right: 10px;
                margin-left: 10px;
            }
            .navbar-toggler {
                display: block;
            }
            /* Não aplica divisão entre os links no mobile */
            .navbar-nav .nav-item + .nav-item::before {
                display: none;
            }

            .navbar-nav .nav-link {
                font-size: 1.0em;
                padding: 8px 0px;
                
                margin-right: 00px;
                margin-left: 00px;
            }

            .navbar .user-icon {
                font-size: 1.2rem;
                margin-right: 5px;
                margin-left: 8px;
            }
        }
        {% block style %}
        {% endblock %}
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Meu Sistema</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav me-auto customNavBar">
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="{% url 'listar-estoque' %}"><i class="fas fa-home"></i> Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/user-dashboard/' %}active{% endif %}" href="{% url 'painel-vendas' %}"><i class="fas fa-cash-register"></i> Caixa</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/contato/' %}active{% endif %}" href="{% url 'registrar-ponto' %}"><i class="fas fa-receipt"></i> Ponto</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center">
                    <i class="fas fa-user-circle user-icon me-2"></i> <!-- Ícone de usuário -->
                    <div class="dropdown">
                        <button 
                            class="btn btn-light dropdown-toggle" 
                            type="button" 
                            data-bs-toggle="dropdown" 
                            aria-expanded="false">
                            {% if user.is_authenticated %}{{ user.username }}{% else %}Visitante{% endif %}
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end custom-dropdown-menu">
                            {% if user.is_authenticated %}
                                <li>
                                    <a class="dropdown-item" href="{% url 'logout' %}">Logout</a>
                                </li>
                            {% else %}
                                <form method="POST" class="px-4 py-3" action="{% url 'login' %}">
                                    {% csrf_token %}
                                    <div class="mb-3">
                                        <label for="username" class="form-label">Usuário:</label>
                                        <input type="text" class="form-control" name="username" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="password" class="form-label">Senha:</label>
                                        <input type="password" class="form-control" name="password" required>
                                    </div>
                                    <button type="submit" class="btn btn-primary w-100">Entrar</button>
                                </form>
                                <li><hr class="dropdown-divider"></li>
                                <li>
                                    <a class="dropdown-item" id="btnEsqueciSenha">Esqueceu a senha?</a>
                                </li>
                            {% endif %}
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    <div class="content">
        {% block body %}
        {% endblock %}
    </div>

    <script>
        function handleUserClick() {
            const dropdown = document.getElementById("dropdown-menu");
            dropdown.classList.toggle("show");
        }
        {% block script %}
        {% endblock %}
        
        $(document).ready(function () {
            toastr.options = {
                "closeButton": true,
                "debug": false,
                "newestOnTop": true,
                "progressBar": true,
                "positionClass": "toast-top-right",
                "preventDuplicates": false,
                "onclick": null,
                "showDuration": "300",
                "hideDuration": "1000",
                "timeOut": "5000",
                "extendedTimeOut": "1000",
                "showEasing": "swing",
                "hideEasing": "linear",
                "showMethod": "fadeIn",
                "hideMethod": "fadeOut"
            };

            {% if messages %}
                {% for message in messages %}
                    {% if message.level == DEFAULT_MESSAGE_LEVELS.ERROR %}
                        toastr.error("{{ message }}", "Erro");
                    {% elif message.level == DEFAULT_MESSAGE_LEVELS.SUCCESS %}
                        toastr.success("{{ message }}", "Sucesso");
                    {% elif message.level == DEFAULT_MESSAGE_LEVELS.WARNING %}
                        toastr.warning("{{ message }}", "Aviso");
                    {% elif message.level == DEFAULT_MESSAGE_LEVELS.INFO %}
                        toastr.info("{{ message }}", "Atenção");
                    {% endif %}
                {% endfor %}
            {% endif %}

            $(document).ready(function() {
                $('#btnEsqueciSenha').click(function(event) {
                    event.preventDefault();
                    toastr.info('Se você esqueceu sua senha contate o administrador do sistema.');
                });
            });
        });
    </script>
</body>
</html>
