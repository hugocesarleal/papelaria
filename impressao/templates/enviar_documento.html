{% extends base_template %}

{% block title %}
    Enviar Documento
{% endblock %}

{% block body %}

<div class="container mt-5">
    <h1 class="mb-4">Enviar Documentos</h1>
    <form id="upload-form" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-group">
            <label for="documentos">Selecione os documentos:</label>
            <input type="file" id="documentos" name="documentos" multiple class="form-control" style="display: none;">
        </div>
        <div id="drop-area" class="border border-primary p-5 text-center">
            <div id="low" style="display: block;">
                <p>Arraste e solte os arquivos aqui</p>
                <p>ou</p>
                <button type="button" class="btn btn-secondary" onclick="document.getElementById('documentos').click();">Selecione os arquivos</button>
            </div>

            <div id="high" style="display: none;">
                <p style="font-weight: bold; color: black;">Solte o arquivo aqui</p>
                <p><i class="fas fa-file-upload" style="font-size: 3em;"></i></p>
            </div>
        </div>
        <div id="file-list" class="mt-3"></div>
        <button type="submit" class="btn btn-primary mt-3">Enviar</button>
    </form>
</div>


<style>

#drop-area.highlight {
    border-color: #666;
    background-color: rgba(0, 0, 0, 0.1);
}

</style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        var dropArea = document.getElementById('drop-area');
        var fileInput = document.getElementById('documentos');
        var fileListContainer = document.getElementById('file-list');
        var low = document.getElementById('low');
        var high = document.getElementById('high');
        var timeoutId;
    
        // Prevenir comportamentos padrão
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            document.addEventListener(eventName, preventDefaults, false);
        });
    
        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }
    
        // Adicionar classes para os eventos de arrastar e soltar
        ['dragenter', 'dragover'].forEach(eventName => {
            dropArea.addEventListener(eventName, () => {
                clearTimeout(timeoutId);
                dropArea.classList.add('highlight');
                low.style.display = 'none';
                high.style.display = 'block';
            }, false);
        });
    
        ['dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, (e) => {
                if (e.target === dropArea || !dropArea.contains(e.relatedTarget)) {
                    timeoutId = setTimeout(() => {
                        dropArea.classList.remove('highlight');
                        low.style.display = 'block';
                        high.style.display = 'none';
                    }, 100);
                }
            }, false);
        });
    
        // Lidar com os arquivos soltos
        dropArea.addEventListener('drop', handleDrop, false);
        fileInput.addEventListener('change', handleFiles, false);
    
        function handleDrop(e) {
            var dt = e.dataTransfer;
            var files = dt.files;
    
            handleFiles({ target: { files: files } });
        }
    
        function handleFiles(e) {
            var newFiles = Array.from(e.target.files);
            var existingFiles = Array.from(fileInput.files);
            var allFiles = existingFiles.concat(newFiles);
    
            // Remover arquivos duplicados
            var uniqueFiles = [];
            var fileNames = new Set();
            allFiles.forEach(file => {
                if (!fileNames.has(file.name)) {
                    fileNames.add(file.name);
                    uniqueFiles.push(file);
                }
            });
    
            var dataTransfer = new DataTransfer();
            uniqueFiles.forEach(file => dataTransfer.items.add(file));
            fileInput.files = dataTransfer.files;
            updateFileList();
        }
    
        function updateFileList() {
            fileListContainer.innerHTML = '';
            Array.from(fileInput.files).forEach((file, index) => {
                var fileItem = document.createElement('div');
                fileItem.className = 'file-item d-flex justify-content-between align-items-center';
                fileItem.innerHTML = `
                    <span>${file.name}</span>
                    <button type="button" class="btn btn-danger btn-sm" onclick="removeFile(${index})">Remover</button>
                `;
                fileListContainer.appendChild(fileItem);
            });
        }
    
        window.removeFile = function(index) {
            var dataTransfer = new DataTransfer();
            Array.from(fileInput.files).forEach((file, i) => {
                if (i !== index) {
                    dataTransfer.items.add(file);
                }
            });
            fileInput.files = dataTransfer.files;
            updateFileList();
        };
    });
    </script>
{% endblock %}
